# Builds the preview (all landings under /<slug>/ + QA hub) and deploys to GitHub Pages.
# Tracking stays off (SITE_ENV defaults to preview) and every page is noindex.
#
# GATED on the repo variable PAGES_ENABLED (the build job is skipped unless it is 'true').
# The repo is public and Pages is enabled with the GitHub Actions source; to set it up again:
#   gh api -X POST repos/<owner>/pedlex-landing-pages/pages -f build_type=workflow
#   gh variable set PAGES_ENABLED --body true
# Set PAGES_ENABLED to false to pause deploys. See PROJECT.md section 2 for hosting alternatives.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
